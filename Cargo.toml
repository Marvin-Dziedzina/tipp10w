[package]
name = "tipp10w"
version = "2.0.1"
edition = "2021"

[dependencies]
chrono = "0.4.40"
env_logger = "0.11.8"
log = "0.4.27"
ratatui = "0.29.0"
rusqlite = { version = "0.35.0", features = ["bundled"] }

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
